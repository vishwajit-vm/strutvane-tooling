# Managed by strutvane-tooling (canonical/.github/workflows/ci.yml). Do not edit in package repos:
# change it in strutvane-tooling and run `npm run sync` there.
#
# Runs the repo's full quality gate (`npm run ci` = lint + typecheck + test + build) on every
# push to main and every pull request, on Linux, Windows and macOS, on Node 24 and 26 (both LTS).
# npm only (hub docs/18 §7). Dependencies always come from the npm registry
# exactly as pinned in package-lock.json; CI never sees a sibling checkout (dry run §5.2).
# Actions are pinned to full commit SHAs (tag in the trailing comment; SHAs checked 2026-11-15) to
# prevent supply-chain attacks through moved tags; Dependabot keeps them up to date.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24, 26]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }} (npm cache keyed on package-lock.json)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The .npmrc guards (strict-allow-scripts, min-release-age, allow-git) need npm >= 11.19, and
      # an older npm ignores them silently. Pin it so the gate never depends on the bundled npm.
      - name: Use npm 11.19.0
        run: npm install --global npm@11.19.0

      - name: No local-only or non-registry dependencies
        run: node .github/scripts/check-deps.mjs

      - name: Install (exactly the lockfile; install scripts only from the allowlist)
        run: npm ci

      - name: Verify registry signatures and provenance of installed packages
        run: npm audit signatures

      - name: Quality gate (lint, typecheck, test, build)
        run: npm run ci
